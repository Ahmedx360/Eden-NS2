name: Build Windows Binaries

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Ninja & CMake
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build with Ninja
      shell: pwsh
      run: |
        cmake --build build --parallel

    - name: Prepare Artifact Directory
      shell: pwsh
      run: |
        mkdir output_bin
        # Adjust the path below if the executable places itself elsewhere inside build/bin
        Get-ChildItem -Path "build" -Recurse -Filter "eden.exe" | Copy-Item -Destination "output_bin"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Eden-NS2-Windows-Release
        path: output_bin/
